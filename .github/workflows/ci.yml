name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

jobs:

  fmt_check:
    name: Check code formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print cargo fmt version
        run: cargo fmt --version

      - name: Run cargo fmt
        run: cargo fmt --check

  doc_check:
    name: Check documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Run cargo doc
        run: cargo doc --no-deps --all-features --workspace

  feature_combinations:
    name: Check features (${{ matrix.features || 'none' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ["", "derive", "async", "derive,async"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Run cargo check
        run: cargo check -p peer-pressure --no-default-features --features "${{ matrix.features }}" --all-targets

      - name: Run tests
        run: cargo test -p peer-pressure --no-default-features --features "${{ matrix.features }}"

      - name: Run cargo doc
        run: cargo doc --no-deps -p peer-pressure --no-default-features --features "${{ matrix.features }}"

  clippy_check:
    name: Check Clippy warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print Clippy version
        run: cargo clippy --version

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build_and_test:
    name: Build and run tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print cargo version
        run: cargo --version

      - name: Run cargo check
        run: cargo check --all-targets --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run doctests
        run: cargo test --doc --all-features

  msrv_check:
    name: Check the declared MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Run cargo check on the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features
