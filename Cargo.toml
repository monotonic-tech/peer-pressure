[workspace]
members = ["core", "derive"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/monotonic-tech/peer-pressure"

[workspace.dependencies]
peer-pressure-derive = { path = "derive/", version = "0.1.0" }
peer-pressure = { path = "core/", version = "0.1.0" }

futures = "0.3.32"
